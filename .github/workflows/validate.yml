name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Agent Skills spec (open standard)
        run: uvx --from skills-ref agentskills validate --recursive skills

      - name: Python tests for bundled scripts
        run: python3 -m pytest skills/codebase-tidiness/tests -q

      - name: Claude Code plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          claude plugin validate . --strict
